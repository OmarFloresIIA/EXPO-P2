services:
  db:
    image: postgres:17
    container_name: pg-ventas-expo
    environment:
      POSTGRES_DB: ventas_industriales
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Define APP_DB_PASSWORD en .env}
      CONSULTA_DB_PASSWORD: ${CONSULTA_DB_PASSWORD:?Define CONSULTA_DB_PASSWORD en .env}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:?Define ADMIN_DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata_expo:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/scripts:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ventas_industriales"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  pgdata_expo:
